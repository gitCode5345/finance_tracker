name: finance_tracker
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  bcrypt: ^1.1.3
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:

  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
        - asset: assets/fonts/LeagueSpartan-SemiBold.ttf
